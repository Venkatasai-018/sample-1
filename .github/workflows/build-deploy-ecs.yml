name: Build and Deploy to ECS

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Select Environment'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - qa

permissions:
  id-token: write    
  contents: read     

env:
  AWS_REGION: us-east-1

jobs:
  # BUILD JOB
  build:
    name: Build and Push to ECR
    runs-on: ubuntu-latest

    environment: backend_${{ github.event.inputs.environment }}
    outputs:
      image_tag: ${{ steps.generate-tag.outputs.tag }}
      image_uri: ${{ steps.build-image.outputs.image_uri }}
      environment: backend_${{ github.event.inputs.environment }}
    
    # variables

    env:
      ROLE_ARN:           ${{ vars.AWS_ROLE_ARN }}
      AWS_ACCOUNT_ID:     ${{ vars.AWS_ACCOUNT_ID }}
      ECR_REGISTRY:       ${{ vars.ECR_REGISTRY }}
      ECR_REPOSITORY:     ${{ vars.ECR_REPOSITORY }}
      ENV_SUFFIX:         ${{ vars.ENV_SUFFIX }}
      SOURCE_REPO:        ${{ vars.SOURCE_REPO }}
      SOURCE_REPO_BRANCH: ${{ vars.SOURCE_REPO_BRANCH }}
      NODE_VERSION:       ${{ vars.NODE_VERSION }}
      TRIVY_SEVERITY:     ${{ vars.TRIVY_SEVERITY }}        # e.g. "HIGH" or "HIGH,MEDIUM"
      TRIVY_REPORT_SEVERITY: ${{ vars.TRIVY_REPORT_SEVERITY }}  # e.g. "HIGH,MEDIUM,LOW"
    
    steps:
      - name: Display loaded environment configuration
        run: |
          echo "=== Loaded from GitHub Environment: ${{ github.event.inputs.environment }} ==="
          echo "ROLE_ARN:        $ROLE_ARN"
          echo "AWS_ACCOUNT_ID:  $AWS_ACCOUNT_ID"
          echo "ECR_REGISTRY:    $ECR_REGISTRY"
          echo "ECR_REPOSITORY:  $ECR_REPOSITORY"
          echo "ENV_SUFFIX:      $ENV_SUFFIX"
          echo "SOURCE_REPO:     $SOURCE_REPO"

      # Checkout backend repository

      - name: Checkout source code from another repo
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: ${{ env.SOURCE_REPO_BRANCH }}
          token: ${{ secrets.ORG_PAT }}
          path: source-code

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Lint source code
        if: hashFiles('source-code/package.json') != ''
        working-directory: source-code
        run: |
          npm ci
          if npm run | grep -qE '^\s+lint$'; then
            npm run lint
          else
            echo "No 'lint' script defined in package.json — skipping."
          fi

      
      # OIDC Authentication with AWS
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS identity (OIDC check)
        run: |
          echo "Verifying AWS authentication..."
          aws sts get-caller-identity
          echo "OIDC authentication successful!"

      # Login to Amazon ECR
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # Generate Image Tag
      - name: Generate Docker image tag
        id: generate-tag
        run: |
          # Tag format: <env>-<short-sha>-<timestamp>
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          TIMESTAMP=$(date +'%Y%m%d-%H%M%S')
          TAG="${ENV_SUFFIX}-${SHORT_SHA}-${TIMESTAMP}"
          
          echo "Generated tag: $TAG"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "IMAGE_TAG=$TAG" >> $GITHUB_ENV

      # Build Docker Image
      - name: Build Docker image
        id: build-image
        working-directory: source-code
        run: |
          IMAGE_URI="${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"
          IMAGE_URI_LATEST="${ECR_REGISTRY}/${ECR_REPOSITORY}:${ENV_SUFFIX}-latest"
          
          echo "Building Docker image: $IMAGE_URI"
          docker build \
            --build-arg ENV=${ENV_SUFFIX} \
            -t $IMAGE_URI \
            -t $IMAGE_URI_LATEST \
            .
          
          echo "image_uri=$IMAGE_URI" >> $GITHUB_OUTPUT
          echo "IMAGE_URI=$IMAGE_URI" >> $GITHUB_ENV
          echo "IMAGE_URI_LATEST=$IMAGE_URI_LATEST" >> $GITHUB_ENV

      # Trivy Vulnerability Scanning
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.IMAGE_URI }}
          format: 'table'
          exit-code: '1'             
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: ${{ env.TRIVY_SEVERITY }}

      - name: Download Trivy HTML template
        if: always()
        run: |
          mkdir -p .trivy
          curl -sSL -o .trivy/html.tpl \
            https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/html.tpl

      - name: Generate Trivy HTML report
        if: always()
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.IMAGE_URI }}
          format: 'template'
          template: '@.trivy/html.tpl'
          output: 'trivy-report.html'
          severity: ${{ env.TRIVY_REPORT_SEVERITY }}

      - name: Generate Trivy JSON report (optional)
        if: always()
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.IMAGE_URI }}
          format: 'json'
          output: 'trivy-report.json'
          severity: ${{ env.TRIVY_REPORT_SEVERITY }}

      - name: Upload Trivy HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-html-report-${{ env.IMAGE_TAG }}
          path: |
            trivy-report.html
            trivy-report.json
          retention-days: 30

      # Push image to ECR
      - name: Push Docker image to ECR
        run: |
          echo "Pushing image to ECR: $IMAGE_URI"
          docker push $IMAGE_URI
          docker push $IMAGE_URI_LATEST
          echo "Image pushed successfully!"
          echo "Tag: $IMAGE_TAG"

  # DEPLOY JOB
  
  deploy:
    name: Deploy to ECS
    needs: build
    runs-on: ubuntu-latest
    environment: ${{ needs.build.outputs.environment }}
    
    env:
      ROLE_ARN:            ${{ vars.AWS_ROLE_ARN }}
      ENV_SUFFIX:          ${{ vars.ENV_SUFFIX }}
      ECS_CLUSTER:         ${{ vars.ECS_CLUSTER }}
      ECS_SERVICE:         ${{ vars.ECS_SERVICE }}
      ECS_TASK_DEFINITION: ${{ vars.ECS_TASK_DEFINITION }}
      CONTAINER_NAME:        ${{ vars.CONTAINER_NAME }}
      SECRETS_MANAGER_ARN:   ${{ vars.SECRETS_MANAGER_ARN }}     # App-level secrets (JWT_SECRET, API keys, etc.)
      DB_SECRETS_MANAGER_ARN: ${{ vars.DB_SECRETS_MANAGER_ARN }}  # DB credentials secret (e.g. RDS-managed)
      IMAGE_URI:             ${{ needs.build.outputs.image_uri }}
      IMAGE_TAG:           ${{ needs.build.outputs.image_tag }}
    
    steps:
      - name: Display deploy configuration
        run: |
          echo "=== Deploying to environment: ${{ needs.build.outputs.environment }} ==="
          echo "ECS_CLUSTER:     $ECS_CLUSTER"
          echo "ECS_SERVICE:     $ECS_SERVICE"
          echo "TASK_DEFINITION: $ECS_TASK_DEFINITION"
          echo "IMAGE_URI:       $IMAGE_URI"

      # OIDC Authentication with AWS
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # Pull image from ECR
      - name: Login to ECR for pull
        uses: aws-actions/amazon-ecr-login@v2

      - name: Pull Docker image from ECR
        run: |
          echo "Pulling image to verify availability..."
          docker pull $IMAGE_URI
          echo "Image pulled successfully: $IMAGE_URI"

      # Update ECS Task Definition
      - name: Download current task definition
        run: |
          echo "Downloading task definition: $ECS_TASK_DEFINITION"
          aws ecs describe-task-definition \
            --task-definition $ECS_TASK_DEFINITION \
            --query taskDefinition > task-definition.json

      # ----------------------------------------------------------------
      # Inject env vars from GitHub Environment secrets
      # ----------------------------------------------------------------
      # Writes to the container's `environment` block (plaintext in task def).
      # Use for non-sensitive config or values you'd rather manage in GitHub.
      - name: Inject env vars from GitHub secrets
        env:
          # Sensitive DB connection values (GitHub Environment secrets)
          DB_HOST:     ${{ secrets.DB_HOST }}
          DB_PORT:     ${{ secrets.DB_PORT }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_NAME:     ${{ secrets.DB_NAME }}

          # Per-environment URLs / origins (GitHub Environment variables)
          PLAID_REDIRECT_URI:  ${{ vars.PLAID_REDIRECT_URI }}
          PLAID_WEBHOOK_URL:   ${{ vars.PLAID_WEBHOOK_URL }}
          CORS_ORIGIN:         ${{ vars.CORS_ORIGIN }}
          GOOGLE_REDIRECT_URI: ${{ vars.GOOGLE_REDIRECT_URI }}
          GMAIL_REDIRECT_URI:  ${{ vars.GMAIL_REDIRECT_URI }}
          NODE_ENV:            ${{ vars.NODE_ENV }}
          LOG_LEVEL:           ${{ vars.LOG_LEVEL }}
          PLAID_ENV:           ${{ vars.PLAID_ENV }}
        run: |
          set -e

          # Build name=value lines (one per line). Constants are hardcoded here;
          # per-env values come from GitHub secrets/vars above.
          ENV_ARRAY=$(printf '%s\n' \
            "DB_HOST=$DB_HOST" \
            "DB_PORT=$DB_PORT" \
            "DB_USERNAME=$DB_USERNAME" \
            "DB_NAME=$DB_NAME" \
            "PORT=5000" \
            "NODE_ENV=$NODE_ENV" \
            "JWT_EXPIRES_IN=7d" \
            "PLAID_ENABLED=true" \
            "PLAID_ENV=$PLAID_ENV" \
            "PLAID_REDIRECT_URI=$PLAID_REDIRECT_URI" \
            "PLAID_WEBHOOK_URL=$PLAID_WEBHOOK_URL" \
            "CORS_ORIGIN=$CORS_ORIGIN" \
            "GOOGLE_REDIRECT_URI=$GOOGLE_REDIRECT_URI" \
            "GMAIL_ENABLED=true" \
            "GMAIL_REDIRECT_URI=$GMAIL_REDIRECT_URI" \
            "GMAIL_REVOKE_HOURS=72" \
            "AI_EMAIL_ENRICHMENT_ENABLED=true" \
            "LOG_LEVEL=$LOG_LEVEL" \
            "POLL_INTERVAL_SECONDS=25" \
            "FIRST_CHECK_DELAY_SECONDS=25" \
            "CHECK_INTERVAL_UNDER_1H_SECONDS=25" \
            "CHECK_INTERVAL_UNDER_6H_SECONDS=25" \
            "CHECK_INTERVAL_UNDER_24H_SECONDS=25" \
            "CHECK_INTERVAL_OVER_24H_SECONDS=25" \
            "MERCHANT_NO_RESPONSE_HOURS=0.00056" \
          | jq -R -s '
              split("\n")
              | map(select(length > 0))
              | map(capture("^(?<name>[^=]+)=(?<value>.*)$"))
            ')

          echo "Environment vars to inject:"
          echo "$ENV_ARRAY" | jq '.'

          jq --arg name "$CONTAINER_NAME" --argjson envs "$ENV_ARRAY" \
            '.containerDefinitions |= map(if .name == $name then .environment = $envs else . end)' \
            task-definition.json > task-definition.updated.json

          mv task-definition.updated.json task-definition.json
          echo "Task definition updated with env vars from GitHub secrets + vars."

      # ----------------------------------------------------------------
      # Inject secret refs from AWS Secrets Manager (app + DB secrets)
      # ----------------------------------------------------------------
      # Reads keys from BOTH secrets and merges them into the container's
      # `secrets` block. ECS fetches values at task start via execution role.
      # NOTE: key names must not collide across the two secrets or with the
      # `environment` block injected above.
      - name: Inject Secrets Manager refs
        run: |
          set -e

          build_refs() {
            local arn="$1"
            local rename_map_json="${2:-{\}}"   # optional JSON object: { "oldKey": "NEW_NAME" }
            if [ -z "$arn" ]; then
              echo "[]"
              return
            fi
            local json
            json=$(aws secretsmanager get-secret-value \
              --secret-id "$arn" \
              --query SecretString --output text)
            echo "$json" | jq -r --arg arn "$arn" --argjson rename "$rename_map_json" '
              to_entries
              | map({
                  name: ( $rename[.key] // .key ),  # rename if present, else keep
                  valueFrom: ($arn + ":" + .key + "::")
                })
            '
          }

          echo "Fetching APP secret: $SECRETS_MANAGER_ARN"
          APP_REFS=$(build_refs "$SECRETS_MANAGER_ARN" '{}')

          # RDS-managed secret uses lowercase keys (password, username, host, port, dbname).
          # Map them to the env var names our app expects (DB_PASSWORD only here — others
          # come from GitHub Environment secrets in the previous step).
          echo "Fetching DB secret:  $DB_SECRETS_MANAGER_ARN"
          DB_REFS=$(build_refs "$DB_SECRETS_MANAGER_ARN" '{"password":"DB_PASSWORD"}')

          # Drop any DB keys we don't want exposed as env vars
          DB_REFS=$(echo "$DB_REFS" | jq '[.[] | select(.name == "DB_PASSWORD")]')

          SECRETS_ARRAY=$(jq -s 'add | unique_by(.name)' <(echo "$APP_REFS") <(echo "$DB_REFS"))

          echo "Merged secrets to inject:"
          echo "$SECRETS_ARRAY" | jq '.'

          jq --arg name "$CONTAINER_NAME" --argjson secrets "$SECRETS_ARRAY" '
            .containerDefinitions |= map(
              if .name == $name then .secrets = $secrets else . end
            )
          ' task-definition.json > task-definition.updated.json

          mv task-definition.updated.json task-definition.json
          echo "Task definition updated with refreshed Secrets Manager references."
      
      - name: Verify env + secrets are present on target container
        run: |
          echo "=== Container names in task def ==="
          jq -r '.containerDefinitions[].name' task-definition.json

          echo ""
          echo "=== Looking for container: $CONTAINER_NAME ==="
          MATCH=$(jq --arg n "$CONTAINER_NAME" '[.containerDefinitions[] | select(.name == $n)] | length' task-definition.json)
          if [ "$MATCH" -eq 0 ]; then
            echo "ERROR: CONTAINER_NAME '$CONTAINER_NAME' does not match any container in task definition."
            echo "Fix: set vars.CONTAINER_NAME to one of the names listed above."
            exit 1
          fi

          echo ""
          echo "=== environment[] on $CONTAINER_NAME ==="
          jq --arg n "$CONTAINER_NAME" '.containerDefinitions[] | select(.name == $n) | .environment // []' task-definition.json

          echo ""
          echo "=== secrets[] on $CONTAINER_NAME ==="
          jq --arg n "$CONTAINER_NAME" '.containerDefinitions[] | select(.name == $n) | .secrets // []' task-definition.json

          ENV_COUNT=$(jq --arg n "$CONTAINER_NAME" '[.containerDefinitions[] | select(.name == $n) | .environment // [] | .[]] | length' task-definition.json)
          SEC_COUNT=$(jq --arg n "$CONTAINER_NAME" '[.containerDefinitions[] | select(.name == $n) | .secrets // [] | .[]] | length' task-definition.json)
          echo ""
          echo "environment count: $ENV_COUNT"
          echo "secrets count:     $SEC_COUNT"
          if [ "$ENV_COUNT" -eq 0 ] && [ "$SEC_COUNT" -eq 0 ]; then
            echo "ERROR: No env vars or secrets were injected. Check GitHub secrets and Secrets Manager."
            exit 1
          fi

      - name: Update task definition with new image
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: ${{ env.CONTAINER_NAME }}
          image: ${{ env.IMAGE_URI }}

      # Deploy & force new deployment
      - name: Deploy updated task to ECS (force new deployment)
        uses: aws-actions/amazon-ecs-deploy-task-definition@v1
        with:
          task-definition: ${{ steps.task-def.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          force-new-deployment: true       
          wait-for-service-stability: true
          wait-for-minutes: 10

      # Health Check
      - name: Container health check
        run: |
          echo "=== Checking ECS Service Health ==="
          echo "Cluster: $ECS_CLUSTER"
          echo "Service: $ECS_SERVICE"
          
          # Get service details
          SERVICE_INFO=$(aws ecs describe-services \
            --cluster $ECS_CLUSTER \
            --services $ECS_SERVICE)
          
          RUNNING=$(echo "$SERVICE_INFO" | jq -r '.services[0].runningCount')
          DESIRED=$(echo "$SERVICE_INFO" | jq -r '.services[0].desiredCount')
          PENDING=$(echo "$SERVICE_INFO" | jq -r '.services[0].pendingCount')
          
          echo "Running tasks:  $RUNNING"
          echo "Desired tasks:  $DESIRED"
          echo "Pending tasks:  $PENDING"
          
          # Verify counts match
          if [[ "$RUNNING" != "$DESIRED" ]]; then
            echo "ERROR: Running count ($RUNNING) does not match desired count ($DESIRED)"
            exit 1
          fi
          
          # Check task health status
          TASK_ARNS=$(aws ecs list-tasks \
            --cluster $ECS_CLUSTER \
            --service-name $ECS_SERVICE \
            --query 'taskArns' --output text)
          
          for TASK_ARN in $TASK_ARNS; do
            HEALTH=$(aws ecs describe-tasks \
              --cluster $ECS_CLUSTER \
              --tasks $TASK_ARN \
              --query 'tasks[0].healthStatus' --output text)
            
            STATUS=$(aws ecs describe-tasks \
              --cluster $ECS_CLUSTER \
              --tasks $TASK_ARN \
              --query 'tasks[0].lastStatus' --output text)
            
            echo "Task: $TASK_ARN"
            echo "  Status: $STATUS"
            echo "  Health: $HEALTH"
            
            if [[ "$STATUS" != "RUNNING" ]]; then
              echo "ERROR: Task is not in RUNNING state"
              exit 1
            fi
            
            if [[ "$HEALTH" == "UNHEALTHY" ]]; then
              echo "ERROR: Task is UNHEALTHY"
              exit 1
            fi
          done
          
          echo "=== All containers are healthy! ==="

      # Deployment summary
      - name: Deployment summary
        run: |
          echo "=========================================="
          echo "        DEPLOYMENT SUCCESSFUL             "
          echo "=========================================="
          echo "Environment:    ${{ needs.build.outputs.environment }}"
          echo "Image:          $IMAGE_URI"
          echo "Tag:            $IMAGE_TAG"
          echo "Cluster:        $ECS_CLUSTER"
          echo "Service:        $ECS_SERVICE"
          echo "Triggered by:   ${{ github.actor }}"
          echo "=========================================="

# ============================================
# PREREQUISITES:
# ============================================
#
# 1. AWS OIDC Setup:
#    - Create OIDC provider in AWS IAM:
#      Provider URL: https://token.actions.githubusercontent.com
#      Audience: sts.amazonaws.com
#    - Create IAM roles (dev & qa) with trust policy allowing GitHub OIDC
#
# 2. GitHub Secrets Required:
#    - REPO_ACCESS_TOKEN: PAT for checking out another repo
#
# 3. GitHub Environments:
#    - Create "dev" and "qa" environments in repo settings
#    - Add protection rules for qa (e.g., required reviewers)
#
# 4. AWS Resources (per environment):
#    - ECR repository: my-app-repo
#    - ECS cluster: my-app-cluster-dev / my-app-cluster-qa
#    - ECS service: my-app-service-dev / my-app-service-qa
#    - ECS task definition: my-app-task-dev / my-app-task-qa
#
# 5. IAM Role Permissions:
#    - ecr:GetAuthorizationToken
#    - ecr:BatchCheckLayerAvailability
#    - ecr:GetDownloadUrlForLayer
#    - ecr:BatchGetImage
#    - ecr:PutImage
#    - ecs:DescribeServices
#    - ecs:DescribeTaskDefinition
#    - ecs:DescribeTasks
#    - ecs:ListTasks
#    - ecs:RegisterTaskDefinition
#    - ecs:UpdateService
#
# ============================================
