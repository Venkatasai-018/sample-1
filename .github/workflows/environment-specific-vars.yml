# Dev and QA Environment Selection Workflow
# Select dev or qa to print environment-specific values + common secrets and variables

name: Dev-QA Environment Demo

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Select Environment'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - qa

# ============================================
# COMMON VARIABLES (Available to all environments)
# ============================================
env:
  # Normal variables - shared across all environments
  APP_NAME: "MyApplication"
  APP_VERSION: "1.0.0"
  COMPANY_NAME: "MyCompany"
  SUPPORT_EMAIL: "support@mycompany.com"

jobs:
  print-environment-values:
    runs-on: ubuntu-latest
    steps:
      # ============================================
      # STEP 1: Set environment-specific variables
      # ============================================
      - name: Set DEV environment variables
        if: ${{ github.event.inputs.environment == 'dev' }}
        run: |
          echo "Setting DEV environment variables..."
          echo "ENV_NAME=dev" >> $GITHUB_ENV
          echo "API_URL=https://api.dev.example.com" >> $GITHUB_ENV
          echo "DATABASE_HOST=dev-db.example.com" >> $GITHUB_ENV
          echo "DATABASE_NAME=myapp_dev" >> $GITHUB_ENV
          echo "LOG_LEVEL=debug" >> $GITHUB_ENV
          echo "CACHE_ENABLED=false" >> $GITHUB_ENV
          echo "DEBUG_MODE=true" >> $GITHUB_ENV

      - name: Set QA environment variables
        if: ${{ github.event.inputs.environment == 'qa' }}
        run: |
          echo "Setting QA environment variables..."
          echo "ENV_NAME=qa" >> $GITHUB_ENV
          echo "API_URL=https://api.qa.example.com" >> $GITHUB_ENV
          echo "DATABASE_HOST=qa-db.example.com" >> $GITHUB_ENV
          echo "DATABASE_NAME=myapp_qa" >> $GITHUB_ENV
          echo "LOG_LEVEL=info" >> $GITHUB_ENV
          echo "CACHE_ENABLED=true" >> $GITHUB_ENV
          echo "DEBUG_MODE=false" >> $GITHUB_ENV

      # ============================================
      # STEP 2: Print Common/Normal Variables
      # ============================================
      - name: Print Common Variables (All Environments)
        run: |
          echo "=========================================="
          echo "       COMMON VARIABLES (ALL ENVS)       "
          echo "=========================================="
          echo "APP_NAME:       $APP_NAME"
          echo "APP_VERSION:    $APP_VERSION"
          echo "COMPANY_NAME:   $COMPANY_NAME"
          echo "SUPPORT_EMAIL:  $SUPPORT_EMAIL"
          echo ""

      # ============================================
      # STEP 3: Print Environment-Specific Variables
      # ============================================
      - name: Print Environment-Specific Variables
        run: |
          echo "=========================================="
          echo "   ${{ github.event.inputs.environment | upper }} ENVIRONMENT VARIABLES"
          echo "=========================================="
          echo "ENV_NAME:       $ENV_NAME"
          echo "API_URL:        $API_URL"
          echo "DATABASE_HOST:  $DATABASE_HOST"
          echo "DATABASE_NAME:  $DATABASE_NAME"
          echo "LOG_LEVEL:      $LOG_LEVEL"
          echo "CACHE_ENABLED:  $CACHE_ENABLED"
          echo "DEBUG_MODE:     $DEBUG_MODE"
          echo ""

      # ============================================
      # STEP 4: Print Secrets (Common to all environments)
      # ============================================
      # NOTE: Secrets are masked in logs (shown as ***) for security
      # Configure these in: Repository > Settings > Secrets and variables > Actions
      - name: Print Secrets (All Environments)
        env:
          # Repository-level secrets (shared across all environments)
          API_KEY: ${{ secrets.API_KEY }}
          DATABASE_PASSWORD: ${{ secrets.DATABASE_PASSWORD }}
          AWS_ACCESS_KEY: ${{ secrets.AWS_ACCESS_KEY }}
          AWS_SECRET_KEY: ${{ secrets.AWS_SECRET_KEY }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        run: |
          echo "=========================================="
          echo "       SECRETS (ALL ENVIRONMENTS)        "
          echo "=========================================="
          echo "API_KEY:           [SET: $(if [ -n '${{ secrets.API_KEY }}' ]; then echo 'YES'; else echo 'NO'; fi)]"
          echo "DATABASE_PASSWORD: [SET: $(if [ -n '${{ secrets.DATABASE_PASSWORD }}' ]; then echo 'YES'; else echo 'NO'; fi)]"
          echo "AWS_ACCESS_KEY:    [SET: $(if [ -n '${{ secrets.AWS_ACCESS_KEY }}' ]; then echo 'YES'; else echo 'NO'; fi)]"
          echo "AWS_SECRET_KEY:    [SET: $(if [ -n '${{ secrets.AWS_SECRET_KEY }}' ]; then echo 'YES'; else echo 'NO'; fi)]"
          echo "JWT_SECRET:        [SET: $(if [ -n '${{ secrets.JWT_SECRET }}' ]; then echo 'YES'; else echo 'NO'; fi)]"
          echo ""
          echo "NOTE: Secret values are masked in logs for security."
          echo "They will appear as *** if you try to print them directly."
          echo ""

      # ============================================
      # STEP 5: Summary
      # ============================================
      - name: Print Summary
        run: |
          echo "=========================================="
          echo "              SUMMARY                     "
          echo "=========================================="
          echo "Selected Environment: ${{ github.event.inputs.environment }}"
          echo "Workflow Run ID:      ${{ github.run_id }}"
          echo "Triggered by:         ${{ github.actor }}"
          echo "Repository:           ${{ github.repository }}"
          echo "=========================================="

# ============================================
# HOW TO SET UP SECRETS:
# ============================================
# 1. Go to Repository > Settings > Secrets and variables > Actions
# 2. Click "New repository secret"
# 3. Add these secrets:
#    - API_KEY
#    - DATABASE_PASSWORD
#    - AWS_ACCESS_KEY
#    - AWS_SECRET_KEY
#    - JWT_SECRET
#
# ============================================
# HOW TO RUN THIS WORKFLOW:
# ============================================
# 1. Go to Actions tab in your repository
# 2. Select "Dev-QA Environment Demo" workflow
# 3. Click "Run workflow"
# 4. Select either "dev" or "qa" from dropdown
# 5. Click "Run workflow" button
# ============================================
