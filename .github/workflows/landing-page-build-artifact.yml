name: Landing Page CI

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to build
        required: true
        default: dev
        type: choice
        options:
          - dev
          - qa
      node_version:
        description: Node.js version
        required: true
        default: '20.19.5'

permissions:
  id-token: write
  contents: read
  actions: read

jobs:
  build:
    name: Build landing-page artifact
    runs-on: ubuntu-latest
    environment: landing_${{ github.event.inputs.environment }}
    outputs:
      build_id: ${{ steps.meta.outputs.build_id }}

    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
      ENV_SECRET_ARN: ${{ vars.ENV_SECRET_ARN }}
      ENVIRONMENT: ${{ github.event.inputs.environment }}
      NPM_VERSION: '10.8.2'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node + npm
        uses: actions/setup-node@v4
        with:
          node-version: ${{ github.event.inputs.node_version }}
          cache: npm

      - name: Pin npm and show toolchain
        run: |
          npm install -g "npm@${NPM_VERSION}"
          echo "node: $(node -v)"
          echo "npm:  $(npm -v)"

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Create .env file from Secrets Manager
        run: |
          set -euo pipefail
          test -n "$ENV_SECRET_ARN" || { echo "ENV_SECRET_ARN is empty"; exit 1; }

          ENV_FILE=".env.${ENVIRONMENT}"
          aws secretsmanager get-secret-value \
            --secret-id "$ENV_SECRET_ARN" \
            --region "$AWS_REGION" \
            --query 'SecretString' --output text \
          | jq -r 'to_entries[] | "\(.key)=\(.value)"' > "$ENV_FILE"

          echo "Created $ENV_FILE with $(wc -l < "$ENV_FILE") keys"

      - name: Install dependencies (npm ci)
        run: npm ci

      - name: Lint
        run: |
          if npm run | grep -qE '^\s+lint$'; then
            npm run lint
          else
            echo "No 'lint' script defined in package.json — skipping."
          fi

      - name: Build Next.js project
        env:
          NEXT_PUBLIC_ENV: ${{ env.ENVIRONMENT }}
          NODE_ENV: production
        run: |
          set -euo pipefail
          npm run "build:${ENVIRONMENT}"

          echo "=== ls -la after build ==="
          ls -la

          if [ -d .next ]; then
            echo ".next folder generated:"
            ls -la .next
            echo ".next size: $(du -sh .next | cut -f1)"
          else
            echo "ERROR: .next folder NOT found after build"
            exit 1
          fi


      - name: Stage artifact contents
        run: |
          set -uo pipefail
          rm -rf artifact
          mkdir -p artifact

          rsync -a ./ artifact/ \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='artifact' \
            --exclude='*.log' \
            --exclude='.next/cache'
          rc=$?
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 24 ]; then
            echo "rsync failed with exit code $rc"
            exit "$rc"
          fi

          echo "Artifact tree (top level):"
          ls -la artifact
          echo "Sizes:"
          du -sh artifact artifact/.next artifact/node_modules 2>/dev/null || true

      - name: Generate build metadata
        id: meta
        run: |
          BUILD_ID="${ENVIRONMENT}-$(echo "${{ github.sha }}" | cut -c1-7)-$(date +%Y%m%d-%H%M%S)"
          echo "build_id=$BUILD_ID" >> "$GITHUB_OUTPUT"
          echo "Build ID: $BUILD_ID"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: landingpage-${{ env.ENVIRONMENT }}
          path: artifact
          retention-days: 7

      - name: Build summary
        run: |
          echo "=========================================="
          echo "          BUILD SUCCEEDED                 "
          echo "=========================================="
          echo "Environment:  ${ENVIRONMENT}"
          echo "Build ID:     ${{ steps.meta.outputs.build_id }}"
          echo "Run ID:       ${{ github.run_id }}"
          echo "Artifact:     landingpage-${ENVIRONMENT}"
          echo "=========================================="

  deploy:
    name: Deploy to EC2 via SSM
    needs: build
    runs-on: ubuntu-latest
    environment: landing_${{ github.event.inputs.environment }}

    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
      EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
      APP_PORT: ${{ vars.APP_PORT }}
      HEALTH_PATH: ${{ vars.HEALTH_PATH }}
      DEPLOY_GH_TOKEN: ${{ secrets.DEPLOY_GH_TOKEN }}

    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Validate deploy inputs
        run: |
          test -n "$EC2_INSTANCE_ID" || { echo "EC2_INSTANCE_ID is empty"; exit 1; }
          test -n "$APP_PORT" || { echo "APP_PORT is empty"; exit 1; }
          test -n "$HEALTH_PATH" || { echo "HEALTH_PATH is empty"; exit 1; }
          test -n "$DEPLOY_GH_TOKEN" || { echo "DEPLOY_GH_TOKEN secret is empty"; exit 1; }

      - name: Deploy via SSM
        id: ssm
        env:
          GH_TOKEN: ${{ secrets.DEPLOY_GH_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          ART_NAME: landingpage-${{ github.event.inputs.environment }}
          ENVIRONMENT: ${{ github.event.inputs.environment }}
          BUILD_ID: ${{ needs.build.outputs.build_id }}
        run: |
          set -euo pipefail

          # 1) Deploy script (runs on EC2). Quoted heredoc -> NO expansion here.
          cat > deploy.sh <<'SCRIPT_EOF'
          #!/bin/bash
          set -euo pipefail

          TARGET_DIR=/home/ec2-user/landing-page
          STAGE_DIR=/home/ec2-user/landing-page-stage
          ZIP_PATH=/home/ec2-user/landing-page-artifact.zip
          ART_API="https://api.github.com/repos/${REPO}/actions/runs/${RUN_ID}/artifacts?per_page=100"

          echo "Fetching artifact list from: $ART_API"
          ART_RESPONSE=$(curl -fsSL \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            "$ART_API")

          echo "Available artifacts:"
          echo "$ART_RESPONSE" | jq -r '.artifacts[].name'

          ART_ID=$(echo "$ART_RESPONSE" | jq -r --arg N "$ART_NAME" \
            '.artifacts[] | select(.name==$N) | .id' | head -n 1)

          if [ -z "$ART_ID" ] || [ "$ART_ID" = "null" ]; then
            echo "ERROR: Artifact not found: $ART_NAME"
            exit 1
          fi
          echo "Found artifact ID: $ART_ID"

          DOWNLOAD_URL=$(curl -fsS -o /dev/null -w '%{redirect_url}' \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            "https://api.github.com/repos/${REPO}/actions/artifacts/${ART_ID}/zip")

          if [ -z "$DOWNLOAD_URL" ]; then
            echo "ERROR: GitHub did not return a redirect URL (token may lack actions:read scope)"
            exit 1
          fi
          echo "Downloading artifact zip from pre-signed URL..."

          HTTP_CODE=$(curl -fL -w '%{http_code}' \
            "$DOWNLOAD_URL" -o "$ZIP_PATH")
          echo "Download HTTP code: $HTTP_CODE"

          rm -rf "$STAGE_DIR"
          mkdir -p "$STAGE_DIR"
          unzip -oq "$ZIP_PATH" -d "$STAGE_DIR"
          rm -rf "$TARGET_DIR"
          mv "$STAGE_DIR" "$TARGET_DIR"
          rm -f "$ZIP_PATH"

          cd "$TARGET_DIR"

          echo "===== Sanity checks ====="
          echo "node:  $(command -v node || echo MISSING) $(node -v 2>/dev/null || true)"
          echo "npm:   $(command -v npm || echo MISSING) $(npm -v 2>/dev/null || true)"
          echo "pm2:   $(command -v pm2 || echo MISSING) $(pm2 -v 2>/dev/null || true)"
          echo "next binary: $(ls -l ./node_modules/next/dist/bin/next 2>&1 || echo MISSING)"
          echo "ecosystem.config.js: $(ls -l ./ecosystem.config.js 2>&1 || echo MISSING)"

          if [ ! -f ./node_modules/next/dist/bin/next ]; then
            echo "ERROR: ./node_modules/next/dist/bin/next not found in artifact"
            ls -la node_modules/ 2>/dev/null | head -20 || true
            exit 1
          fi

          # Use bundled ecosystem.config.js if shipped, else fall back to /home/ec2-user/app/
          if [ ! -f ./ecosystem.config.js ] && [ -f /home/ec2-user/app/ecosystem.config.js ]; then
            cp /home/ec2-user/app/ecosystem.config.js ./
          fi

          pm2 list || true
          pm2 delete all || true
          pm2 start ecosystem.config.js
          pm2 save

          HEALTH_URL="http://127.0.0.1:${APP_PORT}${HEALTH_PATH}"
          echo "Running health check on $HEALTH_URL"
          for i in $(seq 1 12); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$HEALTH_URL" || echo 000)
            echo "Attempt $i: HTTP $code"
            [ "$code" = "200" ] && break
            if [ "$i" -eq 12 ]; then echo "Health check failed"; exit 1; fi
            sleep 5
          done
          SCRIPT_EOF

          # 2) Build SSM payload safely with jq (no escaping headaches).
          jq -n \
            --arg gh        "$GH_TOKEN" \
            --arg repo      "$REPO" \
            --arg run_id    "$RUN_ID" \
            --arg art       "$ART_NAME" \
            --arg port      "$APP_PORT" \
            --arg health    "$HEALTH_PATH" \
            --arg env       "$ENVIRONMENT" \
            --arg build     "$BUILD_ID" \
            --arg script    "$(cat deploy.sh)" \
            '{
              commands: [
                "export GH_TOKEN=\($gh)",
                "export REPO=\($repo)",
                "export RUN_ID=\($run_id)",
                "export ART_NAME=\($art)",
                "export APP_PORT=\($port)",
                "export HEALTH_PATH=\($health)",
                "export ENVIRONMENT=\($env)",
                "export BUILD_ID=\($build)",
                $script
              ]
            }' > ssm-params.json

          # 3) Send command, then poll for completion.
          CMD_ID=$(aws ssm send-command \
            --document-name AWS-RunShellScript \
            --instance-ids "$EC2_INSTANCE_ID" \
            --comment "Landing page deploy $BUILD_ID" \
            --parameters file://ssm-params.json \
            --query 'Command.CommandId' \
            --output text)

          if [ -z "$CMD_ID" ] || [ "$CMD_ID" = "None" ]; then
            echo "ERROR: send-command did not return a CommandId."
            exit 1
          fi
          echo "SSM Command ID: $CMD_ID"
          echo "command_id=$CMD_ID" >> "$GITHUB_OUTPUT"

          STATUS=InProgress
          for _ in $(seq 1 180); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$CMD_ID" \
              --instance-id "$EC2_INSTANCE_ID" \
              --query 'Status' --output text 2>/dev/null || echo "Pending")
            echo "  status: $STATUS"
            case "$STATUS" in
              Success|Failed|Cancelled|TimedOut) break ;;
            esac
            sleep 5
          done
          echo "ssm_status=$STATUS" >> "$GITHUB_OUTPUT"

      - name: Print deploy logs
        if: always() && steps.ssm.outputs.command_id != ''
        run: |
          CMD_ID="${{ steps.ssm.outputs.command_id }}"
          echo "===== STDOUT ====="
          aws ssm get-command-invocation \
            --command-id "$CMD_ID" \
            --instance-id "$EC2_INSTANCE_ID" \
            --query 'StandardOutputContent' --output text
          echo ""
          echo "===== STDERR ====="
          aws ssm get-command-invocation \
            --command-id "$CMD_ID" \
            --instance-id "$EC2_INSTANCE_ID" \
            --query 'StandardErrorContent' --output text

      - name: Deploy summary
        if: always() && steps.ssm.outputs.command_id != ''
        run: |
          STATUS="${{ steps.ssm.outputs.ssm_status }}"
          echo "=========================================="
          if [ "$STATUS" = "Success" ]; then
            echo "        DEPLOY SUCCEEDED                  "
          else
            echo "        DEPLOY FAILED ($STATUS)           "
          fi
          echo "=========================================="
          echo "Environment:   ${{ github.event.inputs.environment }}"
          echo "Build ID:      ${{ needs.build.outputs.build_id }}"
          echo "Instance:      $EC2_INSTANCE_ID"
          echo "SSM Command:   ${{ steps.ssm.outputs.command_id }}"
          echo "Final status:  $STATUS"
          echo "Triggered by:  ${{ github.actor }}"
          echo "=========================================="
          [ "$STATUS" = "Success" ] || exit 1