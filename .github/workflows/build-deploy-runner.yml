
name: Build and Deploy (Self-Hosted Runner)

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Select Environment'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - qa

permissions:
  contents: read

env:
  NODE_VERSION: '20'

jobs:
  # ============================================
  # BUILD — on GitHub-hosted runner
  # ============================================
  build:
    name: Build artifact
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment }}
    outputs:
      build_id: ${{ steps.pack.outputs.build_id }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build app
        run: npm run build

      - name: Package artifact
        id: pack
        run: |
          BUILD_ID="${{ github.event.inputs.environment }}-$(echo ${{ github.sha }} | cut -c1-7)-$(date +%Y%m%d-%H%M%S)"
          echo "build_id=$BUILD_ID" >> $GITHUB_OUTPUT
          
          mkdir -p staging
          cp -r dist staging/
          cp package.json package-lock.json staging/
          cp -r scripts staging/
          
          tar -czf "artifact.tar.gz" -C staging .
          ls -lh artifact.tar.gz

      # Upload to GitHub Actions artifacts (used by deploy job — no S3 needed)
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-${{ steps.pack.outputs.build_id }}
          path: artifact.tar.gz
          retention-days: 7

  # ============================================
  # DEPLOY — on self-hosted runner ON the EC2
  # ============================================
  deploy:
    name: Deploy on EC2
    needs: build
    # Runner labels: 'self-hosted' + your env label
    # Install runner on EC2 with labels: self-hosted,linux,<env>
    runs-on: [self-hosted, linux, "${{ github.event.inputs.environment }}"]
    environment: ${{ github.event.inputs.environment }}
    
    env:
      BUILD_ID:       ${{ needs.build.outputs.build_id }}
      ENVIRONMENT:    ${{ vars.ENV_SUFFIX }}
      APP_PORT:       ${{ vars.APP_PORT }}
      HEALTH_PATH:    ${{ vars.HEALTH_PATH }}
      DOMAIN:         ${{ vars.DOMAIN }}
      ENV_SECRET_ARN: ${{ vars.ENV_SECRET_ARN }}
      AWS_REGION:     ${{ vars.AWS_REGION }}
    
    steps:
      # Download the artifact straight onto the EC2 (runner workspace)
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: app-${{ needs.build.outputs.build_id }}

      - name: Show what was downloaded
        run: |
          pwd
          ls -lh
          echo "Build ID: $BUILD_ID"

      # Extract → run idempotent setup.sh → reload PM2
      # Everything happens locally on the EC2 — no network transfers
      - name: Deploy via local setup script
        run: |
          set -e
          
          RELEASE_DIR="/opt/deploy/release"
          
          sudo mkdir -p "$RELEASE_DIR"
          sudo tar -xzf artifact.tar.gz -C "$RELEASE_DIR"
          
          # Hand off env vars and run setup
          sudo \
            BUILD_ID="$BUILD_ID" \
            ENVIRONMENT="$ENVIRONMENT" \
            APP_PORT="$APP_PORT" \
            HEALTH_PATH="$HEALTH_PATH" \
            DOMAIN="$DOMAIN" \
            ENV_SECRET_ARN="$ENV_SECRET_ARN" \
            AWS_REGION="$AWS_REGION" \
            bash "$RELEASE_DIR/scripts/setup.sh"

      # Optional: public endpoint check (still runs on EC2, hits its own domain)
      - name: Public endpoint check
        if: env.DOMAIN != ''
        run: |
          URL="https://${DOMAIN}${HEALTH_PATH}"
          echo "Hitting: $URL"
          for i in {1..10}; do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" "$URL" || echo "000")
            echo "Attempt $i: HTTP $CODE"
            [[ "$CODE" == "200" ]] && exit 0
            sleep 5
          done
          echo "ERROR: Health check failed"
          exit 1

      - name: Summary
        run: |
          echo "=========================================="
          echo "       DEPLOYMENT SUCCESSFUL              "
          echo "=========================================="
          echo "Environment:  $ENVIRONMENT"
          echo "Build ID:     $BUILD_ID"
          echo "Domain:       $DOMAIN"
          echo "Triggered by: ${{ github.actor }}"
          echo "=========================================="
